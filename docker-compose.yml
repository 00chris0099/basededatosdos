services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Mineria99*"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "Mineria99*" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DB_SERVER: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "Mineria99*"
      DB_DATABASE: BD_WMS_ECOMMERCE
      JWT_SECRET: "wms-ecommerce-jwt-secret-2025"
      PORT: "4000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:4000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver-data:
