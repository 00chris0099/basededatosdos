<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | WMS Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page" data-page="login">
  <section class="login-card">
    <div class="login-hero">
      <div class="brand-badge">
        <div class="brand-icon"><span class="material-symbols-outlined">warehouse</span></div>
        <div>
          <h1>WMS Pro</h1>
          <p>Gestión inteligente de almacenes y logística de última milla para ecommerce moderno.</p>
        </div>
      </div>
    </div>
    <div class="login-form">
      <h1>Bienvenido</h1>
      <p class="hint">Ingrese sus credenciales para acceder al sistema.</p>
      <form id="loginForm">
        <div class="field">
          <label>Usuario</label>
          <input id="email" type="email" placeholder="nombre@empresa.com" required>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>
        <p id="loginError" class="error-msg"></p>
        <button class="btn btn-primary" style="width:100%" type="submit">Iniciar sesión <span class="material-symbols-outlined">arrow_forward</span></button>
      </form>
      <p class="hint" style="margin-top:30px;text-align:center">©2026 WMS Pro. Ecommerce Logistics Systems.</p>
    </div>
  </section>
  <script src="assets/js/app.js"></script>
</body>
</html>
